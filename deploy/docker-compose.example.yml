name: codesentinel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesentinel
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel -d codesentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  orchestrator:
    profiles: ["app"]
    image: ${CODESENTINEL_IMAGE:-ghcr.io/xixiru/code-sentinel:unreleased}
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    command: ["codesentinel", "serve", "--role", "orchestrator"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../config:/app/config:ro
      - workspaces:/app/workspaces
      - artifacts:/app/artifacts
    restart: unless-stopped

  review-worker:
    profiles: ["app"]
    image: ${CODESENTINEL_IMAGE:-ghcr.io/xixiru/code-sentinel:unreleased}
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    command: ["codesentinel", "worker", "--role", "review"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../config:/app/config:ro
      - workspaces:/app/workspaces
      - artifacts:/app/artifacts
    deploy:
      replicas: 6
    restart: unless-stopped

  repair-worker:
    profiles: ["app"]
    image: ${CODESENTINEL_IMAGE:-ghcr.io/xixiru/code-sentinel:unreleased}
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    command: ["codesentinel", "worker", "--role", "repair"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../config:/app/config:ro
      - workspaces:/app/workspaces
      - artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  workspaces:
  artifacts:
